name: Docker image

# Builds a multi-arch image (linux/amd64 + linux/arm64) and publishes it to
# GitHub Container Registry as ghcr.io/<owner>/<repo>:
#   main        -> :main, :latest, :sha-<short>
#   tag v1.2.3  -> :1.2.3, :1.2, :sha-<short>
# Pull requests that touch the image only build (no push).
#
# To rebuild an existing release (e.g. after changing this workflow), run it
# manually from main with `release_tag` set: it builds the code at that tag and
# publishes only the version tags (:1.2.3, :1.2), leaving :latest and :main alone.
#
# Each architecture builds on a native runner (emulating arm64 under QEMU would
# take hours for the Rust build), pushes by digest, and the merge job combines
# both digests into one manifest list under the final tags.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker-publish.yml
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Rebuild an existing release tag, e.g. v0.1.0 (leave empty to build the selected branch)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}

      - name: Prepare
        id: vars
        run: |
          # Registry paths must be lowercase; artifact names cannot contain '/'.
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          platform=${{ matrix.platform }}
          echo "pair=${platform//\//-}" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.vars.outputs.image }}
          labels: |
            org.opencontainers.image.title=Trykst
            org.opencontainers.image.description=Collaborative Typst editor with native OIDC and seamless SSO
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.revision=${{ steps.vars.outputs.revision }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.vars.outputs.image }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ steps.vars.outputs.pair }}
          cache-to: type=gha,scope=${{ steps.vars.outputs.pair }},mode=max

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ steps.vars.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch manifest
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Prepare
        id: vars
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.vars.outputs.image }}
          # A rebuilt release only gets its version tags.
          tags: |
            type=ref,event=branch,enable=${{ inputs.release_tag == '' }}
            type=semver,pattern={{version}},value=${{ inputs.release_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.release_tag }}
            type=sha,enable=${{ inputs.release_tag == '' }}
            type=raw,value=latest,enable=${{ inputs.release_tag == '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.vars.outputs.image }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect "${{ steps.vars.outputs.image }}:${{ steps.meta.outputs.version }}"
