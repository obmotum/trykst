# Local Keycloak for developing and testing the OIDC login.
#
#   docker compose -f docker-compose.dev.yml up -d
#
# Realm "trykst" is imported on first start (dev/keycloak/trykst-realm.json):
#   alice / alice   trykst-user + trykst-admin
#   bob   / bob     trykst-user
#   carol / carol   no Trykst role (rejected when OIDC_REQUIRED_ROLE is set)
#   vanessa, albrecht, mike, david, thomas, dana (password = username):
#                   colleagues who never signed in, for testing invitations
#   erik  / erik    external guest: member of "Partner AG" only (no Trykst role needed)
# Organizations: "Example IT Solutions GmbH" (everyone above except carol and erik)
#   and "Partner AG" (erik, vanessa)
# Keycloak admin console: http://localhost:8080  (admin / admin)
#
# Then run the server on the host with:
#   OIDC_ISSUER=http://localhost:8080/realms/trykst
#   OIDC_CLIENT_ID=trykst
#   OIDC_CLIENT_SECRET=trykst-dev-secret
#   PUBLIC_URL=http://localhost:3000
#   OIDC_ROLES_CLAIM=realm_access.roles
#   OIDC_ADMIN_ROLE=trykst-admin
#   OIDC_REQUIRED_ROLE=trykst-user
#   OIDC_GUEST_ROLE=trykst-external
#   OIDC_SCOPES=openid profile email organization:*
#   OIDC_HOME_ORGANIZATIONS=example
#   OIDC_DIRECTORY=keycloak
#   OIDC_DIRECTORY_ORG_SOURCE=organizations
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    extra_hosts:
      # Lets Keycloak reach the server on the host for back-channel logout (Linux Docker).
      - "host.docker.internal:host-gateway"
    volumes:
      - ./dev/keycloak:/opt/keycloak/data/import:ro
