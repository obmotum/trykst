services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      # --- Required ---
      # SQLite (default, single-volume, no extra container):
      - DATABASE_URL=sqlite:///data/typstdrive.db?mode=rwc
      - DB_TYPE=sqlite
      # PostgreSQL alternative (uncomment and set DB_TYPE=postgres):
      # - DATABASE_URL=postgres://postgres:password@db:5432/typstdrive
      # - DB_TYPE=postgres

      # --- Optional ---
      # Server listen port (default: 3000, also update the ports mapping above)
      # - PORT=3000
      # Path to compiled frontend assets (default: /app/build)
      # - STATIC_DIR=/app/build
      # 64+ byte secret for signing session cookies.
      # Without this, sessions are cleared on every container restart.
      # Generate one with: openssl rand -hex 64
      # - COOKIE_SECRET=your-64-plus-byte-secret-here

      # --- Sign-in (OIDC, required) ---
      # TypstDrive has no local accounts; users sign in via your identity provider.
      - OIDC_ISSUER=https://sso.example.com/realms/example
      - OIDC_CLIENT_ID=typstdrive
      - OIDC_CLIENT_SECRET=change-me
      # Externally reachable URL of this instance. Redirect URI to register at the IdP:
      #   <PUBLIC_URL>/api/auth/oidc/callback
      # Back-channel logout URL: <PUBLIC_URL>/api/auth/oidc/backchannel-logout
      - PUBLIC_URL=https://typst.example.com
      # Dot path to the roles/groups claim (Keycloak: enable "Add to ID token" on the roles mapper)
      # - OIDC_ROLES_CLAIM=realm_access.roles
      # Members of this role are admins (otherwise the first user becomes admin)
      # - OIDC_ADMIN_ROLE=typstdrive-admin
      # Only members of this role may sign in
      # - OIDC_REQUIRED_ROLE=typstdrive-user
      # Members of this role are guests (external users): they only see what is shared
      # with them and cannot create documents, spaces, packages or API keys
      # - OIDC_GUEST_ROLE=typstdrive-external
      # Claim used as the stable user id (default: sub; Entra ID: oid)
      # - OIDC_SUBJECT_CLAIM=sub
      # - OIDC_USERNAME_CLAIM=preferred_username
      # - OIDC_SCOPES=openid profile email
      # People picker for sharing: search colleagues at the IdP, including those who
      # never signed in (keycloak: service account with view-users + query-users)
      # - OIDC_DIRECTORY=keycloak
      # Organization shown next to the name in the people picker:
      #   attribute     = Keycloak user attribute OIDC_DIRECTORY_ORG_ATTRIBUTE (default)
      #   organizations = Keycloak Organizations membership (Keycloak 26+)
      # - OIDC_DIRECTORY_ORG_SOURCE=organizations
      # - OIDC_DIRECTORY_ORG_ATTRIBUTE=organization
      # Maximum session length before a (silent) re-login at the IdP (default: 10)
      # - SESSION_MAX_AGE_HOURS=10
      # Log verbosity (default: server=debug,tower_http=debug)
      # - RUST_LOG=info
    volumes:
      - appdata:/data

  # Uncomment the db service below when using PostgreSQL (DB_TYPE=postgres).
  # Also switch the volume mount in the app service from appdata:/data
  # to a separate volume, since PostgreSQL manages its own data directory.
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: password
  #     POSTGRES_DB: typstdrive
  #   ports:
  #     - "5433:5432"
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data

volumes:
  appdata:
  # pgdata:   # Uncomment when using PostgreSQL
